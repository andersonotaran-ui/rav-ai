[project]
name = "rav-ai-api"
version = "0.1.0"
description = "RAV AI — API (monolito modular, Clean Architecture)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "arq>=0.26",
    "redis>=5.0",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Lint de arquitetura (ADR-001): domain não importa nada externo;
# contextos não importam uns aos outros (só compartilhado).
[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "Contextos independentes"
type = "independence"
modules = [
    "src.contextos.identidade",
    "src.contextos.estrutura_escolar",
    "src.contextos.estudantes",
    "src.contextos.observacoes",
    "src.contextos.rav",
    "src.contextos.ia",
    "src.contextos.normas",
    "src.contextos.auditoria",
]

[[tool.importlinter.contracts]]
name = "Camadas Clean Architecture (rav)"
type = "layers"
layers = [
    "src.contextos.rav.api",
    "src.contextos.rav.infrastructure",
    "src.contextos.rav.application",
    "src.contextos.rav.domain",
]
